[project]
name = "gemini-github-mcp-proxy"
version = "0.1.0"
description = "Stateless OAuth 2.1 + DCR and Streamable HTTP GitHub MCP Proxy for Gemini"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "httpx[http2]>=0.28.1",
    "pyjwt>=0.2.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
